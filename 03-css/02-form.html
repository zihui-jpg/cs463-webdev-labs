<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CSS Exercise 02 - Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="form-page">
    <main>
      <!-- Start with the code from the HTML folder.
      - Make sure to fix any issues in your HTML code.
      - Delete all mentions of <br>s and style the line breaks with CSS. 
      - Add classes to style the elements on the page. -->
      <h1>Roth IRA Calculator</h1>
      <form method="post" action="/submitform">
        <div class="form-field">
          <label for="balance">Balance ($)</label>
          <input type="text" id="balance" />
        </div>

        <div class="form-field">
          <label for="contribution">Annual contribution ($)</label>
          <!-- Assuming Annual Contribution (4) is a typo -->
          <input type="text" id="contribution" />
        </div>

        <fieldset>
          <legend>Maximize contributions?</legend>
          <div class="radio-group">
            <div class="radio-option">
              <input
                type="radio"
                id="maximize-yes"
                name="maximize"
                value="yes"
              />
              <label for="maximize-yes">Yes</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="maximize-no" name="maximize" value="no" />
              <label for="maximize-no">No</label>
            </div>
          </div>
        </fieldset>

        <div class="form-field">
          <label for="return">Expected rate of return (%)</label>
          <!-- Assuming Expected Rate of return (5) is a typo -->
          <input type="number" id="return" />
        </div>

        <div class="form-field">
          <label for="current-age">Current age</label>
          <input type="number" id="current-age" />
        </div>

        <div class="form-field">
          <label for="retirement-age">Retirement age</label>
          <input type="number" id="retirement-age" />
        </div>

        <div class="form-field">
          <label for="marginal-tax">Marginal tax rate (%)</label>
          <input type="number" id="marginal-tax" />
        </div>

        <div class="button-row">
          <input type="submit" value="Calculate" />
          <input type="reset" value="Reset" />
        </div>

        <p class="form-notes">
          This exercise is a simplified version of the Roth IRA Calculator at
          <a href="https://www.calculator.net/roth-ira-calculator.html"
            >Calculator.net</a
          >
        </p>
      </form>
    </main>
  </body>
</html>
