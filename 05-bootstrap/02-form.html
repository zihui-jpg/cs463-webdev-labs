<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <main class="d-flex container justify-content-center">
      <form
        class="ira-form container bg-white mt-5 border border-2 rounded"
        method="post"
        action="/submitform"
      >
        <div class="row mb-3">
          <h1 class="text-center my-4 fs-2">Roth IRA Calculator</h1>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="balance"
            >Balance ($)</label
          >
          <div class="col-sm-6">
            <input class="form-control" type="text" id="balance" />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="contribution"
            >Annual contribution ($)</label
          >
          <div class="col-sm-6">
            <input class="form-control" type="text" id="contribution" />
          </div>
        </div>

        <fieldset class="row mb-3">
          <legend class="col-sm-6 col-form-label">
            Maximize contributions?
          </legend>
          <div class="col-sm-6">
            <div class="form-check">
              <input
                type="radio"
                id="maximize-yes"
                class="form-check-input"
                name="maximize"
                value="yes"
              />
              <label class="form-check-label" for="maximize-yes">Yes</label>
            </div>
            <div class="form-check">
              <input
                type="radio"
                id="maximize-no"
                class="form-check-input"
                name="maximize"
                value="no"
              />
              <label class="form-check-label" for="maximize-no">No</label>
            </div>
          </div>
        </fieldset>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="return"
            >Expected rate of return (%)</label
          >
          <div class="col-sm-6">
            <input class="form-control" type="number" id="return" />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="current-age"
            >Current age</label
          >
          <div class="col-sm-6">
            <input class="form-control" type="number" id="current-age" />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="retirement-age"
            >Retirement age</label
          >
          <div class="col-sm-6">
            <input class="form-control" type="number" id="retirement-age" />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="marginal-tax"
            >Marginal tax rate (%)</label
          >
          <div class="col-sm-6">
            <input class="form-control" type="number" id="marginal-tax" />
          </div>
        </div>

        <div class="row my-4">
          <div class="d-flex gap-2">
            <input
              class="btn btn-primary w-100"
              type="submit"
              value="Calculate"
            />
            <input
              class="btn btn-outline-secondary w-100"
              type="reset"
              value="Reset"
            />
          </div>
        </div>

        <p class="text-secondary mb-4">
          This exercise is a simplified version of the Roth IRA Calculator at
          <a href="https://www.calculator.net/roth-ira-calculator.html"
            >Calculator.net</a
          >
        </p>
      </form>
    </main>
  </body>
</html>
