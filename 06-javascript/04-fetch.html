<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="04-fetch.css" />
    <script defer src="04-fetch.js"></script>
    <title>JavaScript Exercise 04 - Fetch</title>
  </head>
  <body>
    <main>
      <nav class="navbar">
        <h1 class="brand-logo">Pokedex</h1>
        <div class="search-container">
          <label for="search" class="search-label">Search Pokemon</label>
          <!-- To accommodate accessiblity check -->

          <input
            type="search"
            id="search"
            class="search-bar"
            placeholder="Search Pokemon..."
          />
        </div>
      </nav>
      <!-- Use the loader.gif provided in the images/ folder -->
      <section class="container">
        <div class="loading-container">
          <img
            src="../images/loader.gif"
            alt="loader gif while data loads"
            width="60"
            height="60"
          />
          <p class="loading">Fetching data...</p>
        </div>

        <div class="poke-list"></div>
      </section>
    </main>
  </body>
</html>
